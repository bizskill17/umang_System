name: Deploy to Hostinger

on:
  push:
    branches: [main]
    paths:
      - index.html
      - assets/**
      - api/**
      - .user.ini
      - tests/backend_test.py
      - tests/check-js.cjs
      - tests/adapter_test.cjs
      - .github/workflows/deploy-hostinger.yml
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-test-only-password
          MYSQL_DATABASE: umang_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci-test-only-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, pdo_sqlite, fileinfo
          coverage: none
      - name: Check PHP and JavaScript
        run: |
          php -l api/index.php
          php -l config/database.example.php
          node tests/check-js.cjs
          node tests/adapter_test.cjs
          python3 tests/operations_backend_test.py
      - name: Test application workflows in Chromium
        env:
          UMANG_NODE_MODULES: ${{ runner.temp }}/umang-ui/node_modules
        run: |
          npm install --prefix "$RUNNER_TEMP/umang-ui" --no-audit --no-fund playwright pdf-lib
          node "$UMANG_NODE_MODULES/playwright/cli.js" install --with-deps chromium
          node tests/operations_test.cjs
      - name: Test database backend with disposable MySQL
        env:
          UMANG_TEST_DB_HOST: 127.0.0.1
          UMANG_TEST_DB_NAME: umang_test
          UMANG_TEST_DB_USER: root
          UMANG_TEST_DB_PASSWORD: ci-test-only-password
        run: |
          set -o pipefail
          if ! python3 tests/backend_test.py > backend-test.log 2>&1; then
            cat backend-test.log
            echo "::error title=Backend test failed::$(tail -c 2500 backend-test.log | tr '\n' ' ' | sed 's/%/%25/g')"
            exit 1
          fi
          cat backend-test.log

  deploy:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get the code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare website files
        run: |
          mkdir -p deploy
          cp index.html .user.ini deploy/
          cp -R api assets deploy/

      - name: Upload to Hostinger by FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ftp
          local-dir: ./deploy/
          server-dir: ./
          state-name: .umang-deploy-state.json
          dangerous-clean-slate: false


      - name: Initialize private database configuration
        run: |
          python3 - <<'PY'
          import json
          import urllib.error
          import urllib.request
          url = 'https://system.umangcommunications.com/api/index.php?action=session'
          try:
              response = urllib.request.urlopen(url, timeout=30)
          except urllib.error.HTTPError as error:
              response = error
          result = json.loads(response.read())
          if response.status == 200:
              print('Private configuration is present and the database is reachable.')
          elif response.status == 503 and result.get('error', {}).get('code') == 'not_configured':
              message = result['error'].get('msg', '')
              if 'permissions prevent creating' in message or 'Could not create' in message:
                  raise SystemExit(message)
              print('Private configuration file is present. Enter the database and administrator passwords in Hostinger.')
          else:
              raise SystemExit('API setup check failed (HTTP %s): %s' % (response.status, result.get('error', {}).get('msg', 'no message')))
          PY
